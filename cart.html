<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Munch - Cart</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/cart.css">

    <script src="https://kit.fontawesome.com/4add7e6c9f.js"
            crossorigin="anonymous"></script>

</head>

<body class="cart-page">

<!-- Loading Overlay -->

<div id="loadingOverlay">

    <div class="spinner"></div>

</div>

<!-- Navbar -->

<nav class="navbar">

    <div class="navbar__left">

        <div class="nav-logo">

            <img src="images/logo.png"
                 alt="Food Munch">

        </div>

        <button class="btn-back" onclick="goBack()"> <i class="bi bi-chevron-left"></i> Back</button>

        

    </div>

    <div class="navbar__right">

        <ul class="nav-links">

            <li><a href="menu.html">Menu</a></li>

            <li><a href="index.html">Home</a></li>

        </ul>

    </div>

</nav>

<!-- Cart -->

<div class="cart-container">

    <h1>Your Cart</h1>

    <div id="cartItems">


    </div>

    <div class="total-box" id="totalBox">

        <span>Total</span>

        <span id="totalPrice">₹0</span>

    </div>

    <div class="hero__actions" id="cartButtons">

        <button class="btn-outline-custom"
                onclick="goBack()">

            Continue Shopping

        </button>

        <button
            id="placeOrderBtn"
            class="btn-primary-custom"
            onclick="placeOrder()">

            Place Order

        </button>

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/cart.js"></script>


</body>

</html>

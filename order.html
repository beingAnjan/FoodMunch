<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Munch - Order</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/order.css">

    <script src="https://kit.fontawesome.com/4add7e6c9f.js"
            crossorigin="anonymous"></script>

</head>

<body class="order-page">

<!-- Loading Overlay -->

<div id="loadingOverlay">

    <div class="spinner"></div>

</div>

<!-- Navbar -->

<nav class="navbar">

    <div class="navbar__left">

        <div class="nav-logo">

            <img src="images/logo.png"
                 alt="Food Munch">

        </div>

        <button class="btn-back" onclick="goBack()"> <i class="bi bi-chevron-left"></i> Back</button>

    </div>

    <div class="navbar__right">

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="menu.html">Menu</a></li>

            <li><a href="cart.html">Cart</a></li>

        </ul>

    </div>

</nav>

<!-- Order Form -->

<div class="order-wrapper">

    <h1>Place Your Order</h1>

    <div class="order-summary">

        <h2>Order Summary</h2>

        <div id="orderItems">

        </div>

        <div class="order-total">

            <h3>Total Amount</h3>

            <h2 id="orderTotal">₹0</h2>

        </div>

    </div>

    <h2 class="customer-title">Customer Details</h2>

    <form class="order-form" onsubmit="handleSubmit(event)">

        <div class="field">

            <label>Full Name</label>

            <input
                id="name"
                type="text"
                placeholder="Enter your full name">

            <p class="error" id="nameError"></p>

        </div>

        <div class="field">

            <label>Phone Number</label>

            <input
                id="phone"
                type="tel"
                placeholder="Enter your phone number">

            <p class="error" id="phoneError"></p>

        </div>

        <div class="field">

            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email">

            <p class="error" id="emailError"></p>

        </div>

        <div class="field">

            <label>Payment Method</label>

            <select id="payment">

                <option value="">Choose Payment</option>
                <option>Cash On Delivery</option>
                <option>UPI</option>
                <option>Credit Card</option>
                <option>Debit Card</option>

            </select>

            <p class="error" id="paymentError"></p>

        </div>

        <div class="field field--full">

            <label>Delivery Address</label>

            <textarea
                id="address"
                rows="5"
                placeholder="Enter your address"></textarea>

            <p class="error" id="addressError"></p>

        </div>

        <div class="submit-container">

            <button type="submit" class="btn-confirm">
                Confirm Order
            </button>

        </div>

    </form>

</div>

<div id="successModal" class="success-modal">

    <div class="success-box">

        <i class="fa-solid fa-circle-check success-icon"></i>

        <h2>Order Placed Successfully!</h2>

        <p>
            Thank you for ordering with
            <strong>Food Munch</strong>.
        </p>

        <button
            class="btn-confirm-success"
            onclick="closeSuccessModal()">

            Continue Shopping

        </button>

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/order.js"></script>

</body>

</html>
